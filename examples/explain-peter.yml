name: Explain This Peter
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  peter:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'explain this peter') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: AbhinavMir/doomreviewer@main
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          fish-api-key: ${{ secrets.FISH_API_KEY }}
          anthropic-model: ${{ vars.PETER_ANTHROPIC_MODEL || 'claude-haiku-5-5' }}
